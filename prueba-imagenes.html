<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RVM Serveis Alquiler · Prueba</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#0b1220}header{background:#07111f;color:#fff;border-top:7px solid #2f80ed;padding:14px}.wrap{max-width:1100px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center}.logo{width:45px;height:45px;border-radius:50%;background:#fff;border:3px solid #2f80ed;color:#07111f;display:grid;place-items:center;font-weight:900}.hero{padding:14px}.hero>div{background:linear-gradient(135deg,#07111f,#173968);color:#fff;padding:18px;border-radius:16px}.note{background:#fff3cd;color:#5f4b00;border-radius:8px;padding:8px;font-size:12px}.filters{display:flex;gap:7px;overflow:auto;padding:0 12px 10px}.filters button{border:1px solid #ccd6e3;background:#fff;border-radius:999px;padding:8px 11px;white-space:nowrap}.filters .active{background:#07111f;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;padding:0 10px 80px}.card{background:#fff;border:1px solid #d9e1eb;border-radius:14px;overflow:hidden;box-shadow:0 4px 12px #00162b12}.pic{width:100%;height:150px;object-fit:contain;background:#fff}.c{padding:10px}.c small{color:#2f80ed;font-weight:800}.c h3{margin:5px 0;font-size:16px}.desc{font-size:12px;color:#526173;min-height:32px}.status{font-size:11px;font-weight:800;color:#15803d}.price{display:block;background:#07111f;color:#fff;padding:8px;border-radius:8px;margin:8px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions button{border:0;border-radius:8px;padding:10px;font-weight:800}.tech{background:#eef4ff;color:#0b56c8}.reserve{background:#2f80ed;color:#fff}.admin{position:fixed;right:12px;bottom:12px;background:#07111f;color:#fff;border:2px solid #2f80ed;border-radius:999px;padding:10px 13px;z-index:5}.sheet{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.sheet.open{display:flex}.panel{background:#fff;width:100%;max-height:92vh;overflow:auto;padding:18px;border-radius:18px 18px 0 0}.panel img{width:100%;max-height:260px;object-fit:contain}.close{float:right;border:0;background:#eee;border-radius:50%;width:35px;height:35px}.specs{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px}.specs div{padding:5px 0;border-bottom:1px solid #e5e7eb}.f{margin:8px 0}.f label{display:block;font-size:12px;font-weight:700}.f input,.f textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px}.send{width:100%;padding:12px;border:0;border-radius:8px;background:#25D366;font-weight:900}.muted{font-size:12px;color:#64748b}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr;gap:7px}.pic{height:110px}.c h3{font-size:13px}.desc{display:none}.actions{grid-template-columns:1fr}.actions button{font-size:11px;padding:9px 4px}}</style></head><body><header><div class="wrap top"><div class="brand"><div class="logo">RVM</div><div><b>RVM Serveis · Alquiler</b><br><small>Catarroja · Valencia</small></div></div></div></header><section class="wrap hero"><div><h2>Alquiler de maquinaria profesional</h2><p>Construcción, industria, agricultura y jardín.</p><div class="note">Precios sin IVA. Reserva sujeta a disponibilidad, fianza y confirmación.</div></div></section><div class="wrap filters" id="filters"><button class="active" data-cat="Todos">Todos</button><button data-cat="Construcción">Construcción</button><button data-cat="Industrial">Industrial</button><button data-cat="Agrícola y jardín">Agrícola y jardín</button></div><main class="wrap grid" id="grid">Cargando…</main><button class="admin" onclick="location.href='admin.html'">Administrador</button><div id="detail" class="sheet"><div class="panel"><button class="close" onclick="detail.classList.remove('open')">×</button><h2 id="dt"></h2><img id="di"><div id="db"></div></div></div><div id="reserve" class="sheet"><div class="panel"><button class="close" onclick="reserve.classList.remove('open')">×</button><h2 id="rt"></h2><form id="form"><input type="hidden" id="mid"><input type="hidden" id="mname"><div class="f"><label>Nombre y apellidos</label><input id="name" required></div><div class="f"><label>Teléfono</label><input id="phone" required></div><div class="f"><label>Fecha inicio</label><input id="start" type="date" required></div><div class="f"><label>Fecha fin</label><input id="end" type="date" required></div><div class="f"><label>Observaciones</label><textarea id="notes"></textarea></div><label class="muted"><input id="privacy" type="checkbox" required> Acepto privacidad y condiciones de reserva.</label><br><br><button class="send">Enviar solicitud por WhatsApp</button></form></div></div><script>const SB='https://yejgfasymeuwdneaoile.supabase.co',KEY='sb_publishable_hgxZdrg6IavBnIxBpwYzhQ_KzOKpYFD';let machines=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(cat='Todos'){const a=cat==='Todos'?machines:machines.filter(m=>m.category===cat);grid.innerHTML=a.map(m=>`<article class="card"><img class="pic" src="${esc(m.image_url||'')}" alt="${esc(m.name)}" onerror="this.style.display='none'"><div class="c"><small>${esc(m.category)}</small><h3>${esc(m.name)}</h3><div class="desc">${esc(m.description||'')}</div><div class="status">● ${m.available?'Disponible':'No disponible'}</div><b class="price">${Number(m.price_day||0).toFixed(2).replace('.',',')} € · 1 día + IVA</b><div class="actions"><button class="tech" onclick="showDetail('${m.id}')">Ficha técnica</button><button class="reserve" ${m.available?'':'disabled'} onclick="openReserve('${m.id}')">${m.available?'Reservar':'No disponible'}</button></div></div></article>`).join('')||'No hay máquinas.'}function showDetail(id){const m=machines.find(x=>x.id===id);dt.textContent=m.name;di.src=m.image_url||'';const specs=Object.entries(m.technical_specs||{});db.innerHTML=`<p><b>Categoría:</b> ${esc(m.category)}</p><p>${esc(m.description||'')}</p><div class="specs">${specs.length?specs.map(([k,v])=>`<div><b>${esc(k)}:</b> ${esc(v)}</div>`).join(''):'<div>Ficha técnica pendiente de verificar para el modelo exacto.</div>'}</div><p><b>Precio:</b> ${Number(m.price_day||0).toFixed(2).replace('.',',')} € / día + IVA</p>`;detail.classList.add('open')}function openReserve(id){const m=machines.find(x=>x.id===id);mid.value=m.id;mname.value=m.name;rt.textContent='Reservar · '+m.name;reserve.classList.add('open')}filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{filters.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.cat)});form.onsubmit=async e=>{e.preventDefault();if(end.value<start.value)return alert('Revisa las fechas');const p={machine_id:mid.value,machine_name:mname.value,customer_name:name.value,customer_phone:phone.value,start_date:start.value,end_date:end.value,notes:notes.value,privacy_accepted:true,terms_accepted:true};const r=await fetch(SB+'/rest/v1/reservations',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(p)});if(!r.ok)return alert('No se pudo registrar la solicitud');location.href='https://wa.me/34678642660?text='+encodeURIComponent(`Hola RVM Serveis, quiero solicitar una reserva.\n\nMáquina: ${p.machine_name}\nNombre: ${p.customer_name}\nTeléfono: ${p.customer_phone}\nInicio: ${p.start_date}\nFin: ${p.end_date}\nObservaciones: ${p.notes||'-'}`)};async function load(){const r=await fetch(SB+'/rest/v1/machines?select=*&active=eq.true&order=name.asc&v=2',{headers:{apikey:KEY,Authorization:'Bearer '+KEY},cache:'no-store'});machines=await r.json();render()}load();</script></body></html>
