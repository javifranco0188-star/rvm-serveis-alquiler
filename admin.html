<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Administrador RVM</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#0b1220}header{background:#07111f;color:#fff;padding:24px;border-top:7px solid #2f80ed}.wrap{max-width:700px;margin:auto;padding:20px}.card{background:#fff;padding:20px;border-radius:14px;margin-top:20px;box-shadow:0 5px 18px #00162b14}label{display:block;font-weight:700;margin-top:12px}input,button{width:100%;padding:13px;margin:7px 0;border-radius:8px;font-size:16px}input{border:1px solid #b9c4d2}button{background:#2f80ed;color:#fff;border:0;font-weight:bold;cursor:pointer}button.secondary{background:#07111f}.hidden{display:none}.ok{color:#15803d;font-weight:700}.error{color:#b91c1c}.muted{color:#64748b;font-size:14px}</style></head><body><header><div class="wrap"><b>RVM Serveis · Administrador</b><br><small>Acceso privado</small></div></header><main class="wrap"><section id="login" class="card"><h2>Acceso administrador</h2><p>Introduce tu correo y contraseña.</p><label for="email">Correo</label><input id="email" type="email" value="javifranco0188@gmail.com" autocomplete="username"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" placeholder="Contraseña"><button id="enter">Entrar</button><p id="msg" class="muted"></p></section><section id="panel" class="card hidden"><h2>Panel de administración</h2><p class="ok">✓ Acceso autorizado</p><p>Sesión iniciada correctamente. Desde aquí conectaremos la gestión de máquinas, precios, disponibilidad y reservas.</p><button onclick="location.href='./'">Ver aplicación pública</button><button class="secondary" id="logout">Cerrar sesión</button></section></main><script>const SB='https://yejgfasymeuwdneaoile.supabase.co';const KEY='sb_publishable_hgxZdrg6IavBnIxBpwYzhQ_KzOKpYFD';const AUTH=SB+'/auth/v1';function showPanel(){login.classList.add('hidden');panel.classList.remove('hidden')}async function checkSession(){const token=localStorage.getItem('rvm_access_token');if(!token)return;const r=await fetch(AUTH+'/user',{headers:{apikey:KEY,Authorization:'Bearer '+token}});if(r.ok)showPanel();else localStorage.removeItem('rvm_access_token')}enter.onclick=async()=>{msg.className='muted';msg.textContent='Comprobando…';enter.disabled=true;try{const r=await fetch(AUTH+'/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});const j=await r.json();if(!r.ok||!j.access_token){msg.className='error';msg.textContent='Correo o contraseña incorrectos.';return}localStorage.setItem('rvm_access_token',j.access_token);localStorage.setItem('rvm_refresh_token',j.refresh_token||'');showPanel()}catch(e){msg.className='error';msg.textContent='No se pudo conectar con el servidor.'}finally{enter.disabled=false}};password.addEventListener('keydown',e=>{if(e.key==='Enter')enter.click()});logout.onclick=()=>{localStorage.removeItem('rvm_access_token');localStorage.removeItem('rvm_refresh_token');location.reload()};checkSession();</script></body></html>
