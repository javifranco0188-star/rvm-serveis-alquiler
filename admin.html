<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b56c8"><title>Administrador · RVM Serveis</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#0b1220}header{background:#07111f;color:#fff;border-top:7px solid #2f80ed;padding:16px}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #d9e1eb;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 4px 12px #00162b12}.f{margin:8px 0}.f label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.f input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px}button{border:0;border-radius:8px;padding:10px 12px;font-weight:800}.primary{background:#2f80ed;color:#fff}.hidden{display:none}.muted{font-size:12px;color:#64748b}.ok{color:#15803d}</style></head><body><header><div class="wrap"><b>RVM Serveis · Administrador</b><br><small>Acceso privado</small></div></header><main class="wrap"><section id="loginBox" class="card"><h2>Iniciar sesión</h2><div class="f"><label>Usuario</label><input id="user" value="admin" autocomplete="username"></div><div class="f"><label>Contraseña</label><input id="pass" type="password" autocomplete="current-password"></div><button class="primary" id="loginBtn">Entrar</button><p id="loginMsg" class="muted"></p></section><section id="panel" class="card hidden"><h2>Administrador conectado</h2><p class="ok">Acceso correcto.</p><p>El panel de gestión de maquinaria y reservas se está conectando a esta sesión segura.</p><button onclick="location.href='index.html'">Volver a la app</button></section></main><script>const API='https://yejgfasymeuwdneaoile.supabase.co/functions/v1/rvm-admin-api';async function login(){loginMsg.textContent='Comprobando…';loginBtn.disabled=true;try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',username:user.value.trim(),password:pass.value})});const j=await r.json();if(!r.ok||!j.ok){loginMsg.textContent=j.error||'Usuario o contraseña incorrectos.';return}sessionStorage.setItem('rvm_admin_user',j.user);loginBox.classList.add('hidden');panel.classList.remove('hidden')}catch(e){loginMsg.textContent='No se pudo conectar con el servidor.'}finally{loginBtn.disabled=false}}loginBtn.onclick=login;pass.addEventListener('keydown',e=>{if(e.key==='Enter')login()});if(sessionStorage.getItem('rvm_admin_user')){loginBox.classList.add('hidden');panel.classList.remove('hidden')}</script></body></html>
