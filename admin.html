<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Administrador RVM</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#0b1220}header{background:#07111f;color:#fff;padding:18px;border-top:6px solid #2f80ed;position:sticky;top:0;z-index:5}.wrap{max-width:1150px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.card{background:#fff;padding:15px;border-radius:14px;margin:12px 0;box-shadow:0 5px 18px #00162b14}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#fff;border-radius:12px;padding:12px;text-align:center}.stat b{font-size:22px;display:block}.tabs{display:flex;gap:8px;overflow:auto;margin:10px 0}.tabs button{white-space:nowrap}.machine,.reservation{border:1px solid #dbe3ee;border-radius:12px;padding:12px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f{margin:7px 0}.f label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}input,textarea,select,button{width:100%;padding:10px;border-radius:8px;font-size:14px}input,textarea,select{border:1px solid #b9c4d2;background:#fff}textarea{min-height:76px}button{background:#2f80ed;color:#fff;border:0;font-weight:700;cursor:pointer}.secondary{background:#07111f}.light{background:#eaf2ff;color:#0b56c8}.danger{background:#b91c1c}.green{background:#15803d}.hidden{display:none}.ok{color:#15803d;font-weight:700}.error{color:#b91c1c}.muted{color:#64748b;font-size:13px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#e2e8f0}.badge.ok{background:#dcfce7}.badge.no{background:#fee2e2}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{width:auto}.sectionTitle{display:flex;justify-content:space-between;gap:10px;align-items:center}.whatsapp{background:#25D366;color:#07111f}.preview{width:100%;height:150px;object-fit:contain;background:#f8fafc;border-radius:8px;margin:7px 0}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.wrap{padding:9px}.top{align-items:flex-start}.top .actions{flex-direction:column}}</style></head><body><header><div class="wrap top"><div><b>RVM Serveis · Administrador</b><br><small>Gestión privada</small></div><div class="actions"><button class="light" onclick="location.href='./'">App pública</button><button class="danger" id="logout">Cerrar sesión</button></div></div></header><main class="wrap"><section id="login" class="card"><h2>Acceso administrador</h2><div class="row"><div class="f"><label>Usuario</label><input id="username" value="admin"></div><div class="f"><label>Contraseña</label><input id="password" type="password"></div></div><button id="enter">Entrar</button><p id="msg" class="muted"></p></section><section id="app" class="hidden"><div class="stats"><div class="stat"><b id="sMachines">0</b>Máquinas</div><div class="stat"><b id="sAvailable">0</b>Disponibles</div><div class="stat"><b id="sPending">0</b>Reservas pendientes</div><div class="stat"><b id="sTotalRes">0</b>Reservas totales</div></div><div class="tabs"><button id="tabMachines">Maquinaria</button><button id="tabReservations" class="secondary">Reservas</button><button id="tabAdd" class="secondary">Añadir máquina</button></div><section id="machinesSec"><div class="card"><div class="sectionTitle"><div><h2>Maquinaria</h2><p class="muted">Edita precio de 1 día, precio para varios días, mínimo, fianza, ficha, imagen y disponibilidad.</p></div><button class="light" onclick="loadAll()">Actualizar</button></div><div id="machines" class="grid"></div></div></section><section id="reservationsSec" class="hidden"><div class="card"><h2>Reservas</h2><div id="reservations"></div></div></section><section id="addSec" class="hidden"><div class="card"><h2>Añadir máquina</h2><div class="row"><div class="f"><label>Nombre</label><input id="aName"></div><div class="f"><label>Categoría</label><select id="aCategory"><option>Construcción</option><option>Industrial</option><option>Agrícola y jardín</option></select></div></div><div class="row"><div class="f"><label>Precio 1 día</label><input id="aPrice" type="number" step="0.01"></div><div class="f"><label>Precio/día varios días</label><input id="aPrice2" type="number" step="0.01"></div></div><div class="row"><div class="f"><label>Mínimo días</label><input id="aMin" type="number" value="2"></div><div class="f"><label>Fianza (€)</label><input id="aDeposit" type="number" step="0.01"></div></div><div class="f"><label>URL de imagen</label><input id="aImage"></div><div class="f"><label>Descripción</label><textarea id="aDesc"></textarea></div><div class="f"><label>Ficha técnica (JSON)</label><textarea id="aSpecs">{}</textarea></div><button id="addMachineBtn" class="green">Añadir al catálogo</button><p id="addMsg"></p></div></section></section></main><script>const API='https://yejgfasymeuwdneaoile.supabase.co/functions/v1/rvm-admin-api-v2';let session=sessionStorage.getItem('rvm_admin_session')||'',machineData=[],reservationData=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,session,...extra})});const j=await r.json().catch(()=>({}));if(r.status===401&&action!=='login'){sessionStorage.removeItem('rvm_admin_session');location.reload();throw new Error('session')}if(!r.ok)throw new Error(j.error||'Error');return j}function showApp(){login.classList.add('hidden');app.classList.remove('hidden');loadAll()}enter.onclick=async()=>{msg.textContent='Comprobando…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',username:username.value.trim(),password:password.value})});const j=await r.json();if(!r.ok||!j.ok){msg.className='error';msg.textContent=j.error||'Usuario o contraseña incorrectos.';return}session=j.session;sessionStorage.setItem('rvm_admin_session',session);showApp()}catch{msg.className='error';msg.textContent='No se pudo conectar.'}};logout.onclick=()=>{sessionStorage.clear();location.reload()};password.addEventListener('keydown',e=>{if(e.key==='Enter')enter.click()});async function loadAll(){const [m,r]=await Promise.all([api('listMachines'),api('listReservations')]);machineData=m.data||[];reservationData=r.data||[];renderMachines();renderReservations();sMachines.textContent=machineData.length;sAvailable.textContent=machineData.filter(x=>x.available&&x.active).length;sPending.textContent=reservationData.filter(x=>x.status==='pending').length;sTotalRes.textContent=reservationData.length}function machineCard(m){return `<div class="machine" data-id="${m.id}"><div class="sectionTitle"><b>${esc(m.name)}</b><span class="badge ${m.available&&m.active?'ok':'no'}">${m.active?(m.available?'Disponible':'No disponible'):'Oculta'}</span></div>${m.image_url?`<img class="preview" src="${esc(m.image_url)}">`:''}<div class="f"><label>Nombre</label><input class="name" value="${esc(m.name)}"></div><div class="row"><div class="f"><label>Categoría</label><select class="category"><option ${m.category==='Construcción'?'selected':''}>Construcción</option><option ${m.category==='Industrial'?'selected':''}>Industrial</option><option ${m.category==='Agrícola y jardín'?'selected':''}>Agrícola y jardín</option></select></div><div class="f"><label>Precio 1 día (€)</label><input class="price" type="number" step="0.01" value="${Number(m.price_day||0)}"></div></div><div class="row"><div class="f"><label>Precio/día varios días (€)</label><input class="price2" type="number" step="0.01" value="${Number(m.price_multi_day||0)}"></div><div class="f"><label>Mínimo días</label><input class="mindays" type="number" min="1" value="${Number(m.multi_day_min||2)}"></div></div><div class="f"><label>Fianza (€)</label><input class="deposit" type="number" step="0.01" value="${Number(m.deposit||0)}"></div><div class="f"><label>Descripción</label><textarea class="desc">${esc(m.description||'')}</textarea></div><div class="f"><label>URL de imagen</label><input class="image" value="${esc(m.image_url||'')}"></div><div class="f"><label>Ficha técnica (JSON)</label><textarea class="specs">${esc(JSON.stringify(m.technical_specs||{},null,2))}</textarea></div><div class="row"><div class="f"><label>Disponibilidad</label><select class="available"><option value="true" ${m.available?'selected':''}>Disponible</option><option value="false" ${!m.available?'selected':''}>No disponible</option></select></div><div class="f"><label>Visible</label><select class="active"><option value="true" ${m.active?'selected':''}>Sí</option><option value="false" ${!m.active?'selected':''}>No</option></select></div></div><button class="save">Guardar cambios</button></div>`}function renderMachines(){machines.innerHTML=machineData.map(machineCard).join('');document.querySelectorAll('.save').forEach(b=>b.onclick=()=>saveMachine(b.closest('.machine')))}async function saveMachine(el){let specs={};try{specs=JSON.parse(el.querySelector('.specs').value||'{}')}catch{return alert('Ficha técnica JSON no válida')}const machine={name:el.querySelector('.name').value,category:el.querySelector('.category').value,price_day:Number(el.querySelector('.price').value||0),price_multi_day:Number(el.querySelector('.price2').value||0),multi_day_min:Number(el.querySelector('.mindays').value||2),deposit:Number(el.querySelector('.deposit').value||0),description:el.querySelector('.desc').value,image_url:el.querySelector('.image').value,technical_specs:specs,available:el.querySelector('.available').value==='true',active:el.querySelector('.active').value==='true'};await api('updateMachine',{id:el.dataset.id,machine});alert('Cambios guardados');await loadAll()}function statusName(s){return {pending:'Pendiente',confirmed:'Confirmada',cancelled:'Cancelada',completed:'Completada'}[s]||s}function renderReservations(){reservations.innerHTML=reservationData.length?reservationData.map(r=>`<div class="reservation" data-id="${r.id}"><b>${esc(r.machine_name)}</b><p>${esc(r.customer_name)} · ${esc(r.customer_phone)}</p><p>${esc(r.start_date)} → ${esc(r.end_date)}</p><p>${esc(r.notes||'Sin observaciones')}</p><div class="row"><select class="rstatus"><option value="pending" ${r.status==='pending'?'selected':''}>Pendiente</option><option value="confirmed" ${r.status==='confirmed'?'selected':''}>Confirmada</option><option value="cancelled" ${r.status==='cancelled'?'selected':''}>Cancelada</option><option value="completed" ${r.status==='completed'?'selected':''}>Completada</option></select><a href="https://wa.me/${String(r.customer_phone||'').replace(/\D/g,'')}" target="_blank"><button class="whatsapp" type="button">WhatsApp cliente</button></a></div><button class="saveRes">Actualizar estado</button></div>`).join(''):'<p>No hay reservas.</p>';document.querySelectorAll('.saveRes').forEach(b=>b.onclick=()=>saveReservation(b.closest('.reservation')))}async function saveReservation(el){await api('updateReservation',{id:el.dataset.id,status:el.querySelector('.rstatus').value});alert('Estado actualizado');await loadAll()}addMachineBtn.onclick=async()=>{let specs={};try{specs=JSON.parse(aSpecs.value||'{}')}catch{return alert('JSON no válido')}await api('addMachine',{machine:{name:aName.value,category:aCategory.value,price_day:Number(aPrice.value||0),price_multi_day:Number(aPrice2.value||0),multi_day_min:Number(aMin.value||2),deposit:Number(aDeposit.value||0),image_url:aImage.value,description:aDesc.value,technical_specs:specs,available:true,active:true}});addMsg.textContent='Máquina añadida';await loadAll()};function tab(w){machinesSec.classList.toggle('hidden',w!=='m');reservationsSec.classList.toggle('hidden',w!=='r');addSec.classList.toggle('hidden',w!=='a')}tabMachines.onclick=()=>tab('m');tabReservations.onclick=()=>tab('r');tabAdd.onclick=()=>tab('a');if(session)showApp();</script></body></html>
