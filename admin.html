<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b56c8"><title>Administrador · RVM Serveis</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#0b1220}header{background:#07111f;color:#fff;border-top:7px solid #2f80ed;padding:16px}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #d9e1eb;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 4px 12px #00162b12}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f{margin:8px 0}.f label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.f input,.f select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px}button{border:0;border-radius:8px;padding:10px 12px;font-weight:800;cursor:pointer}.primary{background:#2f80ed;color:#fff}.dark{background:#07111f;color:#fff}.green{background:#16a34a;color:#fff}.red{background:#dc2626;color:#fff}.muted{font-size:12px;color:#64748b}.machine,.reservation{border-top:1px solid #e2e8f0;padding:12px 0}.machine:first-child,.reservation:first-child{border-top:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.status{font-size:12px;font-weight:800}.ok{color:#15803d}.no{color:#b91c1c}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><b>RVM Serveis · Administrador</b><br><small>Acceso privado</small></div></header><main class="wrap"><section id="loginBox" class="card"><h2>Iniciar sesión</h2><div class="f"><label>Usuario</label><input id="user" value="admin" autocomplete="username"></div><div class="f"><label>Contraseña</label><input id="pass" type="password" autocomplete="current-password"></div><button class="primary" id="loginBtn">Entrar</button><p id="loginMsg" class="muted"></p></section><section id="panel" class="hidden"><div class="card"><div class="actions"><button class="dark" onclick="location.href='index.html'">Volver a la app</button><button class="red" id="logoutBtn">Cerrar sesión</button></div></div><div class="card"><h2>Maquinaria</h2><p class="muted">Cambia precio, disponibilidad y visibilidad.</p><div id="machines">Cargando…</div></div><div class="card"><h2>Reservas</h2><p class="muted">Solicitudes recibidas desde la app.</p><div id="reservations">Cargando…</div></div></section></main><script>const SB='https://yejgfasymeuwdneaoile.supabase.co';const KEY='sb_publishable_hgxZdrg6IavBnIxBpwYzhQ_KzOKpYFD';const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};let token=sessionStorage.getItem('rvm_admin_token')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function rpc(fn,body){const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:H,body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}async function valid(){if(!token)return false;try{return await rpc('admin_session_valid',{p_token:token})}catch{return false}}async function login(){loginMsg.textContent='Comprobando…';try{const t=await rpc('admin_login',{p_username:user.value.trim(),p_password:pass.value});if(!t){loginMsg.textContent='Usuario o contraseña incorrectos.';return}token=t;sessionStorage.setItem('rvm_admin_token',token);showPanel()}catch{loginMsg.textContent='No se pudo iniciar sesión.'}}async function showPanel(){loginBox.classList.add('hidden');panel.classList.remove('hidden');await Promise.all([loadMachines(),loadReservations()])}async function loadMachines(){try{const r=await fetch(SB+'/rest/v1/machines?select=*&order=name.asc',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});const ms=await r.json();machines.innerHTML=ms.map(m=>`<div class="machine" data-id="${m.id}"><b>${esc(m.name)}</b><div class="status ${m.available?'ok':'no'}">${m.available?'Disponible':'No disponible'}</div><div class="row"><div class="f"><label>Precio / día (€)</label><input class="price" type="number" step="0.01" value="${Number(m.price_day||0)}"></div><div class="f"><label>Estado</label><select class="avail"><option value="true" ${m.available?'selected':''}>Disponible</option><option value="false" ${!m.available?'selected':''}>No disponible</option></select></div></div><div class="f"><label>Visible en catálogo</label><select class="active"><option value="true" ${m.active?'selected':''}>Sí</option><option value="false" ${!m.active?'selected':''}>No</option></select></div><button class="primary saveMachine">Guardar cambios</button></div>`).join('');document.querySelectorAll('.saveMachine').forEach(b=>b.onclick=()=>saveMachine(b.closest('.machine')))}catch{machines.textContent='No se pudo cargar la maquinaria.'}}async function saveMachine(el){const id=el.dataset.id;const price=Number(el.querySelector('.price').value);const available=el.querySelector('.avail').value==='true';const active=el.querySelector('.active').value==='true';try{await rpc('admin_update_machine',{p_token:token,p_id:id,p_price_day:price,p_available:available,p_active:active});alert('Cambios guardados');loadMachines()}catch{alert('No se pudieron guardar los cambios')}}async function loadReservations(){try{const rs=await rpc('admin_list_reservations',{p_token:token});reservations.innerHTML=rs.length?rs.map(r=>`<div class="reservation" data-id="${r.id}"><b>${esc(r.machine_name)}</b><p>${esc(r.customer_name)} · ${esc(r.customer_phone)}</p><p>${esc(r.start_date)} → ${esc(r.end_date)}</p><p class="muted">${esc(r.notes||'Sin observaciones')}</p><div class="f"><label>Estado</label><select class="rstatus"><option value="pending" ${r.status==='pending'?'selected':''}>Pendiente</option><option value="confirmed" ${r.status==='confirmed'?'selected':''}>Confirmada</option><option value="cancelled" ${r.status==='cancelled'?'selected':''}>Cancelada</option><option value="completed" ${r.status==='completed'?'selected':''}>Completada</option></select></div><button class="primary saveRes">Actualizar estado</button></div>`).join(''):'No hay reservas todavía.';document.querySelectorAll('.saveRes').forEach(b=>b.onclick=()=>saveReservation(b.closest('.reservation')))}catch{reservations.textContent='No se pudieron cargar las reservas.'}}async function saveReservation(el){try{await rpc('admin_update_reservation_status',{p_token:token,p_id:el.dataset.id,p_status:el.querySelector('.rstatus').value});alert('Estado actualizado');loadReservations()}catch{alert('No se pudo actualizar')}}loginBtn.onclick=login;pass.addEventListener('keydown',e=>{if(e.key==='Enter')login()});logoutBtn.onclick=()=>{sessionStorage.removeItem('rvm_admin_token');token='';location.reload()};(async()=>{if(await valid())showPanel()})();</script></body></html>
