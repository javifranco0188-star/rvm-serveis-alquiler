<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba imágenes RVM</title><link rel="stylesheet" href="catalog-images.css?v=3"><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#0b1220}header{background:#07111f;color:white;padding:16px}main{padding:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.c{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #d8e0ea}.pic{height:130px;background:#eef4ff}.t{padding:8px;font-size:13px;font-weight:700}</style></head><body><header><b>RVM Serveis · Prueba de imágenes</b><br><small>Cada máquina debe mostrar una foto diferente</small></header><main id="g"></main><script>const n=['Generador 6.9KVA Trif.','Compresor 24L','Biotriturador Garland','Motoazada Garland','Cortacésped Tractor','Hidrolavador 2800W','Compresor 100L','Pisón Waker','Martillo Demoledor','Motosierra OM-952','Vareador de Aceitunas','Martillo 1300W','Lijadora de Techo','Cortacésped Gasolina','Desbrozador de Martillos','Desbrozador Ruedas 4Tpos','Compresor 50L','Moto-Soldador','Desbrozador 2T. 52cc','Martillo Prof. Demoledor'];g.innerHTML=n.map((x,i)=>`<div class="c"><div class="pic p${i}"></div><div class="t">${i+1}. ${x}</div></div>`).join('')</script></body></html>
