<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrador RVM</title><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#0b1220}header{background:#07111f;color:#fff;border-top:5px solid #1687e8}.wrap{max-width:1180px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 4px 16px #00162b14}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#fff;padding:12px;border-radius:12px;text-align:center}.stat b{display:block;font-size:22px}.tabs{display:flex;gap:8px;overflow:auto}.tabs button{white-space:nowrap}.machine,.reservation{border:1px solid #dbe3ee;border-radius:12px;padding:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f{margin:7px 0}.f label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}input,textarea,select,button{width:100%;padding:10px;border-radius:8px;font-size:14px}input,textarea,select{border:1px solid #b9c4d2;background:#fff}textarea{min-height:74px}button{border:0;background:#2f80ed;color:#fff;font-weight:700}.secondary{background:#07111f}.danger{background:#b91c1c}.green{background:#15803d}.light{background:#eaf2ff;color:#0b56c8}.hidden{display:none}.preview{width:100%;height:170px;object-fit:contain;background:#f8fafc;border-radius:10px;border:1px dashed #cbd5e1}.uploadBox{border:2px dashed #b9cce4;border-radius:12px;padding:12px;background:#f8fbff}.muted{font-size:12px;color:#64748b}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#dcfce7;color:#15803d;font-size:12px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:8px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{width:auto}.whatsapp{background:#25D366;color:#07111f}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.wrap{padding:9px}.top{align-items:flex-start}}
</style></head><body><header><div class="wrap top"><div><b>RVM Serveis · Administrador</b><br><small>Gestión privada</small></div><div class="actions"><button class="light" onclick="location.href='./?v=9'">App pública</button><button class="danger" id="logout">Cerrar sesión</button></div></div></header>
<main class="wrap"><section id="login" class="card"><h2>Acceso administrador</h2><div class="row"><div class="f"><label>Usuario</label><input id="username" value="admin"></div><div class="f"><label>Contraseña</label><input id="password" type="password"></div></div><button id="enter">Entrar</button><p id="msg" class="muted"></p></section>
<section id="app" class="hidden"><div class="stats"><div class="stat"><b id="sMachines">0</b>Máquinas</div><div class="stat"><b id="sAvailable">0</b>Disponibles</div><div class="stat"><b id="sPending">0</b>Pendientes</div><div class="stat"><b id="sTotalRes">0</b>Reservas</div></div>
<div class="tabs"><button id="tabMachines">Maquinaria</button><button id="tabReservations" class="secondary">Reservas</button><button id="tabAdd" class="secondary">Añadir máquina</button><button id="tabLogo" class="secondary">Cambiar logo</button></div>
<section id="machinesSec"><div class="card"><div class="sectionTitle"><div><h2>Maquinaria</h2><p class="muted">Puedes subir JPG, PNG o WEBP directamente, sin URL.</p></div><button class="light" onclick="loadAll()">Actualizar</button></div><div id="machines" class="grid"></div></div></section>
<section id="reservationsSec" class="hidden"><div class="card"><h2>Reservas</h2><div id="reservations"></div></div></section>
<section id="addSec" class="hidden"><div class="card"><h2>Añadir máquina</h2><div class="uploadBox"><label><b>Imagen (JPG, PNG o WEBP)</b></label><input id="aFile" type="file" accept="image/jpeg,image/png,image/webp"><img id="aPreview" class="preview" style="display:none"><p class="muted">Máximo 5 MB.</p></div><div class="row"><div class="f"><label>Nombre</label><input id="aName"></div><div class="f"><label>Categoría</label><select id="aCategory"><option>Construcción</option><option>Industrial</option><option>Agrícola y jardín</option></select></div></div><div class="row"><div class="f"><label>Precio 1 día</label><input id="aPrice" type="number" step="0.01"></div><div class="f"><label>Precio/día varios días</label><input id="aPrice2" type="number" step="0.01"></div></div><div class="row"><div class="f"><label>Mínimo días</label><input id="aMin" type="number" value="2"></div><div class="f"><label>Fianza (€)</label><input id="aDeposit" type="number" step="0.01"></div></div><div class="f"><label>Descripción</label><textarea id="aDesc"></textarea></div><div class="f"><label>Ficha técnica (JSON)</label><textarea id="aSpecs">{}</textarea></div><button id="addMachineBtn" class="green">Añadir al catálogo</button><p id="addMsg"></p></div></section>
<section id="logoSec" class="hidden"><div class="card"><h2>Cambiar logo</h2><div class="uploadBox"><input id="logoFile" type="file" accept="image/jpeg,image/png,image/webp"><img id="logoPreview" class="preview" style="display:none"><button id="saveLogoBtn">Guardar logo</button><p id="logoMsg" class="muted"></p></div></div></section>
</section></main>
<script>
const API='https://yejgfasymeuwdneaoile.supabase.co/functions/v1/rvm-admin-api-v2';let session=sessionStorage.getItem('rvm_admin_session')||'',machineData=[],reservationData=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,session,...extra})});const j=await r.json().catch(()=>({}));if(r.status===401&&action!=='login'){sessionStorage.removeItem('rvm_admin_session');location.reload();throw 0}if(!r.ok)throw new Error(j.error||'Error');return j}
function showApp(){login.classList.add('hidden');app.classList.remove('hidden');loadAll()}
enter.onclick=async()=>{msg.textContent='Comprobando…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',username:username.value.trim(),password:password.value})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Acceso denegado');session=j.session;sessionStorage.setItem('rvm_admin_session',session);showApp()}catch(e){msg.textContent=e.message;msg.style.color='#b91c1c'}};logout.onclick=()=>{sessionStorage.clear();location.reload()};password.onkeydown=e=>{if(e.key==='Enter')enter.click()};
async function fileToPayload(file){if(!file)return null;if(file.size>5*1024*1024)throw new Error('La imagen supera 5 MB');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Formato no permitido');const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});return {base64:String(data).split(',')[1],mime:file.type,name:file.name}}
async function uploadFile(file,name){const p=await fileToPayload(file);if(!p)return'';const r=await api('uploadImage',{...p,name:name||p.name});return r.url}
async function loadAll(){const [m,r]=await Promise.all([api('listMachines'),api('listReservations')]);machineData=m.data||[];reservationData=r.data||[];renderMachines();renderReservations();sMachines.textContent=machineData.length;sAvailable.textContent=machineData.filter(x=>x.available&&x.active).length;sPending.textContent=reservationData.filter(x=>x.status==='pending').length;sTotalRes.textContent=reservationData.length}
function card(m){return `<div class="machine" data-id="${m.id}"><div class="sectionTitle"><b>${esc(m.name)}</b><span class="badge">${m.active?(m.available?'Disponible':'No disponible'):'Oculta'}</span></div><img class="preview currentPreview" src="${esc(m.image_url||'')}" onerror="this.style.display='none'"><div class="uploadBox"><label><b>Cambiar imagen</b></label><input class="file" type="file" accept="image/jpeg,image/png,image/webp"><p class="muted">Selecciona JPG/PNG/WEBP y luego pulsa Guardar cambios.</p></div><div class="f"><label>Nombre</label><input class="name" value="${esc(m.name)}"></div><div class="row"><div class="f"><label>Categoría</label><select class="category"><option ${m.category==='Construcción'?'selected':''}>Construcción</option><option ${m.category==='Industrial'?'selected':''}>Industrial</option><option ${m.category==='Agrícola y jardín'?'selected':''}>Agrícola y jardín</option></select></div><div class="f"><label>Precio 1 día (€)</label><input class="price" type="number" step="0.01" value="${Number(m.price_day||0)}"></div></div><div class="row"><div class="f"><label>Precio/día varios días</label><input class="price2" type="number" step="0.01" value="${Number(m.price_multi_day||0)}"></div><div class="f"><label>Mínimo días</label><input class="mindays" type="number" value="${Number(m.multi_day_min||2)}"></div></div><div class="f"><label>Fianza (€)</label><input class="deposit" type="number" step="0.01" value="${Number(m.deposit||0)}"></div><div class="f"><label>Descripción</label><textarea class="desc">${esc(m.description||'')}</textarea></div><div class="f"><label>Ficha técnica (JSON)</label><textarea class="specs">${esc(JSON.stringify(m.technical_specs||{},null,2))}</textarea></div><div class="row"><select class="available"><option value="true" ${m.available?'selected':''}>Disponible</option><option value="false" ${!m.available?'selected':''}>No disponible</option></select><select class="active"><option value="true" ${m.active?'selected':''}>Visible</option><option value="false" ${!m.active?'selected':''}>Oculta</option></select></div><button class="save">Guardar cambios</button></div>`}
function renderMachines(){machines.innerHTML=machineData.map(card).join('');document.querySelectorAll('.machine .file').forEach(i=>i.onchange=()=>{const el=i.closest('.machine');const img=el.querySelector('.currentPreview');if(i.files[0]){img.src=URL.createObjectURL(i.files[0]);img.style.display='block'}});document.querySelectorAll('.save').forEach(b=>b.onclick=()=>saveMachine(b.closest('.machine')))}
async function saveMachine(el){try{let specs=JSON.parse(el.querySelector('.specs').value||'{}');let old=machineData.find(x=>x.id===el.dataset.id);let image=old.image_url||'';let f=el.querySelector('.file').files[0];if(f){const btn=el.querySelector('.save');btn.textContent='Subiendo imagen…';image=await uploadFile(f,el.querySelector('.name').value)}const machine={name:el.querySelector('.name').value,category:el.querySelector('.category').value,price_day:+el.querySelector('.price').value||0,price_multi_day:+el.querySelector('.price2').value||0,multi_day_min:+el.querySelector('.mindays').value||2,deposit:+el.querySelector('.deposit').value||0,description:el.querySelector('.desc').value,image_url:image,technical_specs:specs,available:el.querySelector('.available').value==='true',active:el.querySelector('.active').value==='true'};await api('updateMachine',{id:el.dataset.id,machine});alert('Cambios guardados');await loadAll()}catch(e){alert(e.message||'No se pudo guardar')}}
function renderReservations(){reservations.innerHTML=reservationData.length?reservationData.map(r=>`<div class="reservation" data-id="${r.id}"><b>${esc(r.machine_name)}</b><p>${esc(r.customer_name)} · ${esc(r.customer_phone)}</p><p>${esc(r.start_date)} → ${esc(r.end_date)}</p><p>${esc(r.notes||'Sin observaciones')}</p><div class="row"><select class="rstatus"><option value="pending" ${r.status==='pending'?'selected':''}>Pendiente</option><option value="confirmed" ${r.status==='confirmed'?'selected':''}>Confirmada</option><option value="cancelled" ${r.status==='cancelled'?'selected':''}>Cancelada</option><option value="completed" ${r.status==='completed'?'selected':''}>Completada</option></select><a href="https://wa.me/${String(r.customer_phone||'').replace(/\D/g,'')}" target="_blank"><button class="whatsapp" type="button">WhatsApp cliente</button></a></div><button class="saveRes">Actualizar estado</button></div>`).join(''):'<p>No hay reservas.</p>';document.querySelectorAll('.saveRes').forEach(b=>b.onclick=async()=>{const el=b.closest('.reservation');await api('updateReservation',{id:el.dataset.id,status:el.querySelector('.rstatus').value});alert('Estado actualizado');loadAll()})}
aFile.onchange=()=>{if(aFile.files[0]){aPreview.src=URL.createObjectURL(aFile.files[0]);aPreview.style.display='block'}};logoFile.onchange=()=>{if(logoFile.files[0]){logoPreview.src=URL.createObjectURL(logoFile.files[0]);logoPreview.style.display='block'}};
addMachineBtn.onclick=async()=>{try{let specs=JSON.parse(aSpecs.value||'{}'),image='';if(aFile.files[0])image=await uploadFile(aFile.files[0],aName.value);await api('addMachine',{machine:{name:aName.value,category:aCategory.value,price_day:+aPrice.value||0,price_multi_day:+aPrice2.value||0,multi_day_min:+aMin.value||2,deposit:+aDeposit.value||0,image_url:image,description:aDesc.value,technical_specs:specs,available:true,active:true}});addMsg.textContent='Máquina añadida';loadAll()}catch(e){alert(e.message)}};
saveLogoBtn.onclick=async()=>{try{if(!logoFile.files[0])return alert('Selecciona una imagen');const p=await fileToPayload(logoFile.files[0]);const r=await api('saveLogo',p);logoMsg.textContent='Logo guardado correctamente';localStorage.setItem('rvm_logo_url',r.url)}catch(e){logoMsg.textContent=e.message}};
function tab(w){machinesSec.classList.toggle('hidden',w!=='m');reservationsSec.classList.toggle('hidden',w!=='r');addSec.classList.toggle('hidden',w!=='a');logoSec.classList.toggle('hidden',w!=='l')}tabMachines.onclick=()=>tab('m');tabReservations.onclick=()=>tab('r');tabAdd.onclick=()=>tab('a');tabLogo.onclick=()=>tab('l');if(session)showApp();
</script></body></html>
