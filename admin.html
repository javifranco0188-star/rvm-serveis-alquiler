<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrador RVM</title><style>body{font-family:Arial;background:#f4f7fb;margin:0;color:#0b1220}header{background:#07111f;color:white;padding:24px;border-top:7px solid #2f80ed}.wrap{max-width:700px;margin:auto;padding:20px}.card{background:white;padding:20px;border-radius:14px;margin-top:20px}input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px}button{background:#2f80ed;color:white;border:0;font-weight:bold}</style></head><body><header><div class="wrap"><b>RVM Serveis · Administrador</b><br><small>Acceso privado por correo</small></div></header><main class="wrap"><div class="card"><h2>Acceso administrador</h2><p>Introduce el correo autorizado. Recibirás un enlace seguro para entrar.</p><input id="email" type="email" placeholder="Correo administrador"><button id="send">Enviar enlace de acceso</button><p id="msg"></p></div></main><script>const SB='https://yejgfasymeuwdneaoile.supabase.co';const KEY='sb_publishable_hgxZdrg6IavBnIxBpwYzhQ_KzOKpYFD';send.onclick=async()=>{msg.textContent='Enviando…';const r=await fetch(SB+'/auth/v1/otp',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),create_user:true})});msg.textContent=r.ok?'Revisa tu correo y abre el enlace de acceso.':'No se pudo enviar el enlace.'};</script></body></html>
