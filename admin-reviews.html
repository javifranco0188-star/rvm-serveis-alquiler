<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06111f">
  <meta name="robots" content="noindex, nofollow">
  <title>RVM Serveis · Administrar reseñas</title>
  <style>
    :root{--navy:#06111f;--blue:#0876d8;--red:#d71820;--green:#16803c;--line:#d6e0ea}*{box-sizing:border-box}body{margin:0;background:#edf3f8;color:#101827;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1050px;margin:auto;padding:20px}header{background:var(--navy);color:#fff;border-top:5px solid var(--blue)}header .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px}header a{color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 10px 30px #00152d15}.login{max-width:460px;margin:50px auto}.login label{display:grid;gap:6px;margin:14px 0;font-weight:800}input{width:100%;padding:13px;border:1px solid #aebdca;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:11px 15px;font:inherit;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:#fff}.approve{background:var(--green);color:#fff}.hide{background:#e7eef5;color:#21364b}.delete{background:#fff0f0;color:#a3131a;border:1px solid #ffc4c7}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0}.toolbar p{color:#607083}.reviews{display:grid;gap:14px}.review{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.review.pending{border-left:6px solid #f0a500}.review.approved{border-left:6px solid var(--green)}.meta{display:flex;flex-wrap:wrap;gap:9px;align-items:center;color:#607083;font-size:13px}.stars{color:#e89b00;font-size:19px}.comment{font-size:16px;line-height:1.55}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.status{padding:10px;border-radius:9px;margin-top:12px}.error{background:#fff0f0;color:#9d1f25}.ok{background:#e8f8ee;color:#146a39}.hidden{display:none}@media(max-width:650px){header .wrap,.toolbar{align-items:flex-start;flex-direction:column}.actions button{flex:1}}
  </style>
</head>
<body>
  <header><div class="wrap"><div><b>RVM Serveis</b><br><small>Administración de reseñas</small></div><a href="admin.html">Volver al administrador principal</a></div></header>
  <main class="wrap">
    <section id="loginCard" class="card login"><h1>Acceso administrador</h1><p>Usa el mismo usuario y contraseña de RVM Alquiler.</p><form id="loginForm"><label>Usuario<input id="username" autocomplete="username" required></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Entrar</button><div id="loginStatus" class="status hidden"></div></form></section>
    <section id="manager" class="hidden"><div class="toolbar"><div><h1>Reseñas recibidas</h1><p>Aprueba únicamente comentarios auténticos enviados por clientes.</p></div><button id="logout" class="hide">Cerrar sesión</button></div><div id="managerStatus" class="status hidden"></div><div id="reviewList" class="reviews"></div></section>
  </main>
  <script>
    const API='https://yejgfasymeuwdneaoile.supabase.co/functions/v1/rvm-admin-api-v2';
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let session=localStorage.getItem('rvmAdminSession')||'';
    async function call(action,data={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,session,...data})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'No se pudo completar la acción');return j}
    function showLogin(message=''){loginCard.classList.remove('hidden');manager.classList.add('hidden');if(message){loginStatus.textContent=message;loginStatus.className='status error'}else loginStatus.className='status hidden'}
    function showManager(){loginCard.classList.add('hidden');manager.classList.remove('hidden');loadReviews()}
    async function loadReviews(){reviewList.innerHTML='<div class="card">Cargando reseñas…</div>';try{const j=await call('listReviews');const rows=j.data||[];reviewList.innerHTML=rows.length?rows.map(r=>`<article class="review ${r.approved?'approved':'pending'}"><div class="meta"><b>${esc(r.customer_name)}</b><span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span><span>${new Date(r.created_at).toLocaleString('es-ES')}</span><strong>${r.approved?'Publicada':'Pendiente'}</strong></div><p class="comment">${esc(r.comment)}</p><div class="actions">${r.approved?`<button class="hide" data-hide="${r.id}">Ocultar</button>`:`<button class="approve" data-approve="${r.id}">Aprobar y publicar</button>`}<button class="delete" data-delete="${r.id}">Eliminar</button></div></article>`).join(''):'<div class="card">Todavía no hay reseñas recibidas.</div>';document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>change(b.dataset.approve,true));document.querySelectorAll('[data-hide]').forEach(b=>b.onclick=()=>change(b.dataset.hide,false));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeReview(b.dataset.delete))}catch(e){if(/Sesión/.test(e.message)){session='';localStorage.removeItem('rvmAdminSession');showLogin(e.message)}else reviewList.innerHTML='<div class="status error">'+esc(e.message)+'</div>'}}
    async function change(id,approved){try{await call('updateReview',{id,approved});loadReviews()}catch(e){alert(e.message)}}
    async function removeReview(id){if(!confirm('¿Eliminar esta reseña definitivamente?'))return;try{await call('deleteReview',{id});loadReviews()}catch(e){alert(e.message)}}
    loginForm.onsubmit=async e=>{e.preventDefault();loginStatus.textContent='Comprobando…';loginStatus.className='status';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',username:username.value.trim(),password:password.value})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Acceso incorrecto');session=j.session;localStorage.setItem('rvmAdminSession',session);password.value='';showManager()}catch(e){loginStatus.textContent=e.message;loginStatus.className='status error'}};
    logout.onclick=()=>{session='';localStorage.removeItem('rvmAdminSession');showLogin()};
    session?call('listReviews').then(showManager).catch(()=>showLogin('La sesión ha caducado.')):showLogin();
  </script>
</body>
</html>
