<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Administrador RVM</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#0b1220}header{background:#07111f;color:#fff;padding:24px;border-top:7px solid #2f80ed}.wrap{max-width:700px;margin:auto;padding:20px}.card{background:#fff;padding:20px;border-radius:14px;margin-top:20px;box-shadow:0 5px 18px #00162b14}label{display:block;font-weight:700;margin-top:12px}input,button{width:100%;padding:13px;margin:7px 0;border-radius:8px;font-size:16px}input{border:1px solid #b9c4d2}button{background:#2f80ed;color:#fff;border:0;font-weight:bold;cursor:pointer}.secondary{background:#07111f}.hidden{display:none}.ok{color:#15803d;font-weight:700}.error{color:#b91c1c}.muted{color:#64748b;font-size:14px}</style></head><body><header><div class="wrap"><b>RVM Serveis · Administrador</b><br><small>Acceso privado</small></div></header><main class="wrap"><section id="login" class="card"><h2>Acceso administrador</h2><p>Introduce tu usuario y contraseña.</p><label>Usuario</label><input id="username" value="admin" autocomplete="username"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" placeholder="Contraseña"><button id="enter">Entrar</button><p id="msg" class="muted"></p></section><section id="panel" class="card hidden"><h2>Panel de administración</h2><p class="ok">✓ Acceso autorizado</p><p>Sesión iniciada correctamente.</p><p>Preparado para gestionar máquinas, precios, disponibilidad y reservas.</p><button onclick="location.href='./'">Ver aplicación pública</button><button class="secondary" id="logout">Cerrar sesión</button></section></main><script>const API='https://yejgfasymeuwdneaoile.supabase.co/functions/v1/rvm-admin-api';function showPanel(){login.classList.add('hidden');panel.classList.remove('hidden')}enter.onclick=async()=>{msg.className='muted';msg.textContent='Comprobando…';enter.disabled=true;try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',username:username.value.trim(),password:password.value})});const j=await r.json();if(!r.ok||!j.ok){msg.className='error';msg.textContent=j.error||'Usuario o contraseña incorrectos.';return}sessionStorage.setItem('rvm_admin_session',j.session);showPanel()}catch(e){msg.className='error';msg.textContent='No se pudo conectar con el servidor.'}finally{enter.disabled=false}};password.addEventListener('keydown',e=>{if(e.key==='Enter')enter.click()});logout.onclick=()=>{sessionStorage.removeItem('rvm_admin_session');location.reload()};if(sessionStorage.getItem('rvm_admin_session'))showPanel();</script></body></html>
